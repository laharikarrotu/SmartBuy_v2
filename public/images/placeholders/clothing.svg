<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#f5f5f5" />
  
  <!-- T-shirt shape -->
  <path d="M320,100 L260,100 L240,50 L160,50 L140,100 L80,100 L120,180 L120,340 L280,340 L280,180 L320,100 Z" 
        fill="#e6e6e6" stroke="#d1d1d1" stroke-width="4"/>
  
  <!-- Collar -->
  <path d="M240,50 L200,80 L160,50" fill="none" stroke="#d1d1d1" stroke-width="4"/>
  
  <!-- Text -->
  <text x="200" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#757575">
    Clothing
  </text>
  
  <!-- Size label -->
  <rect x="170" y="280" width="60" height="30" rx="5" ry="5" fill="#f5f5f5" stroke="#d1d1d1" stroke-width="2"/>
  <text x="200" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#757575">
    S M L
  </text>
</svg> 