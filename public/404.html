<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SmartBuy - Redirecting</title>
  <script>
    // Redirect to the root of the application
    // This solves the issue with direct access to routes when using client-side routing
    sessionStorage.setItem('redirectPath', window.location.pathname);
    window.location.href = '/';
  </script>
</head>
<body>
  <h1>Redirecting...</h1>
  <p>If you are not redirected automatically, please click <a href="/">here</a>.</p>
</body>
</html>
