<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <!-- Shopping cart icon for favicon -->
  <rect width="64" height="64" fill="#ffffff" rx="8" ry="8"/>
  
  <g transform="translate(8, 8) scale(0.75)">
    <!-- Main cart body in blue gradient -->
    <path d="M10,30 L50,30 L45,10 L15,10 Z" fill="#00467f"/>
    <path d="M15,30 L55,30 L50,10 L20,10 Z" fill="#2d85c3"/>
    
    <!-- Diamond shape on top -->
    <rect x="45" y="2" width="10" height="10" fill="#2d85c3" transform="rotate(45, 50, 7)"/>
    
    <!-- Wheels -->
    <circle cx="25" cy="40" r="5" fill="#5baade"/>
    <circle cx="45" cy="40" r="5" fill="#5baade"/>
  </g>
  
  <!-- Letter S for SmartBuy -->
  <text x="32" y="58" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#00467f" text-anchor="middle">S</text>
</svg> 